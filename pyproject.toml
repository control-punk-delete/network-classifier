[build-system]
requires = [
    "setuptools>=68",
    "wheel"
]

build-backend = "setuptools.build_meta"


[project]

name = "network-classifier"

version = "0.1.0"

description = "IP network classification library"

requires-python = ">=3.11"

dependencies = [
    "pytricia>=1.3.0"
]


[tool.setuptools.packages.find]

where = [
    "."
]